<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Brewfather to Niimbot printing workflow</title>
  <desc id="desc">Open a batch, preview the label and choose copies, then print over Bluetooth to a Niimbot D11H.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151515"/><stop offset="1" stop-color="#26231e"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#d7a13c"/><stop offset="1" stop-color="#f1c96e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <text x="48" y="47" fill="#f5f2ea" font-family="Arial,sans-serif" font-size="20" font-weight="700">A three-step print workflow</text>
  <text x="48" y="73" fill="#b9b2a4" font-family="Arial,sans-serif" font-size="14">No server, no export file, and no changes to your Brewfather batch.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="105" width="315" height="170" rx="16" fill="#302f2e" stroke="#514d47"/>
    <rect x="74" y="132" width="52" height="40" rx="8" fill="#211f1c" stroke="#d8aa50"/>
    <path d="M83 143h34M83 151h25M83 159h30" stroke="#eac46e" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="207" fill="#f5f2ea" font-family="Arial,sans-serif" font-size="18" font-weight="700">1  Open a batch</text>
    <text x="74" y="232" fill="#c8c1b5" font-family="Arial,sans-serif" font-size="13">Brewfather › Batches</text>
    <text x="74" y="253" fill="#8f897e" font-family="Arial,sans-serif" font-size="12">Use the single Print label button.</text>
  </g>

  <path d="M382 190h65" stroke="#d8aa50" stroke-width="3" stroke-linecap="round"/>
  <path d="m437 177 14 13-14 13" fill="none" stroke="#d8aa50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="443" y="105" width="315" height="170" rx="16" fill="#302f2e" stroke="#514d47"/>
    <rect x="469" y="127" width="265" height="77" rx="9" fill="#fffdf8"/>
    <text x="484" y="149" fill="#151515" font-family="Arial,sans-serif" font-size="13" font-weight="700">Citra American Pale Ale</text>
    <text x="484" y="168" fill="#151515" font-family="Arial,sans-serif" font-size="11">ABV ≈4.7%   IBU 47</text>
    <text x="484" y="185" fill="#151515" font-family="Arial,sans-serif" font-size="11">OG 1.046   FG ≈1.010</text>
    <rect x="469" y="219" width="94" height="31" rx="6" fill="#3d3526" stroke="#d8aa50"/>
    <text x="485" y="239" fill="#f5d38a" font-family="Arial,sans-serif" font-size="13">Copies 1</text>
    <rect x="572" y="219" width="85" height="31" rx="6" fill="url(#gold)"/>
    <text x="592" y="239" fill="#211b12" font-family="Arial,sans-serif" font-size="13" font-weight="700">Print</text>
    <text x="469" y="266" fill="#c8c1b5" font-family="Arial,sans-serif" font-size="13" font-weight="700">2  Preview &amp; choose copies</text>
  </g>

  <path d="M777 190h65" stroke="#d8aa50" stroke-width="3" stroke-linecap="round"/>
  <path d="m832 177 14 13-14 13" fill="none" stroke="#d8aa50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="838" y="105" width="315" height="170" rx="16" fill="#302f2e" stroke="#514d47"/>
    <rect x="927" y="129" width="138" height="84" rx="10" fill="#211f1c" stroke="#d8aa50" stroke-width="3"/>
    <path d="M949 151h94v45h-94z" fill="#f5f2ea"/>
    <path d="M961 161h70M961 172h55M961 183h62" stroke="#34312b" stroke-width="4" stroke-linecap="round"/>
    <path d="M959 213v15h74v-15M945 151v-10h103v10" fill="none" stroke="#d8aa50" stroke-width="3" stroke-linejoin="round"/>
    <text x="864" y="252" fill="#f5f2ea" font-family="Arial,sans-serif" font-size="18" font-weight="700">3  Print over Bluetooth</text>
    <text x="864" y="274" fill="#c8c1b5" font-family="Arial,sans-serif" font-size="13">Niimbot D11H · 300 dpi</text>
  </g>
</svg>
