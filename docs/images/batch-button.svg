<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Brewfather batch card with one Print label button</title>
  <desc id="desc">A dark Brewfather batch card for batch 119 with one gold Print label button in the header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#292724"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1000" height="470" rx="24" fill="url(#bg)"/>
  <text x="44" y="51" fill="#f4f0e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Brewfather · Batches</text>
  <text x="44" y="77" fill="#aaa398" font-family="Arial,sans-serif" font-size="14">One action in the batch header opens the label preview.</text>
  <g filter="url(#shadow)">
    <rect x="44" y="112" width="912" height="270" rx="18" fill="#363534" stroke="#56514a"/>
    <rect x="44" y="112" width="8" height="270" rx="4" fill="#efb93f"/>
    <text x="76" y="154" fill="#bdb6aa" font-family="Arial,sans-serif" font-size="18">Batch <tspan fill="#f7f2e8" font-weight="700">#119</tspan> — ANDREI PAPOU</text>
    <rect x="770" y="132" width="154" height="48" rx="9" fill="#3e3526" stroke="#d1a04a" stroke-width="2"/>
    <path d="M792 151v-10h20v10M792 166h-7v-17h34v17h-7M792 159h20v14h-20z" fill="none" stroke="#f2d18d" stroke-width="2"/>
    <text x="826" y="162" fill="#f2d18d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Print label</text>
    <rect x="76" y="199" width="848" height="133" rx="13" fill="#141414" stroke="#494744"/>
    <circle cx="115" cy="264" r="27" fill="#d9a940" opacity=".18"/>
    <path d="M102 267c0-17 24-17 26 0 15-2 22 20 7 25h-28c-17-4-15-25-5-25zm11-10v-10m-6 11-7-7m19 7 7-7" fill="none" stroke="#e7b94e" stroke-width="4" stroke-linecap="round"/>
    <text x="160" y="242" fill="#f0ede7" font-family="Arial,sans-serif" font-size="23" font-weight="700">Citra American Pale Ale - 50 L — Andrey</text>
    <text x="160" y="274" fill="#aaa398" font-family="Arial,sans-serif" font-size="16">American Pale Ale · All Grain</text>
    <text x="160" y="307" fill="#e2ddd2" font-family="Arial,sans-serif" font-size="15">ABV 4.7%  ·  47 IBU  ·  OG 1.046  ·  FG 1.010</text>
    <rect x="838" y="215" width="62" height="32" rx="16" fill="#47484b"/>
    <text x="857" y="237" fill="#d6d6d6" font-family="Arial,sans-serif" font-size="14" font-weight="700">v1</text>
  </g>
  <path d="M849 399v24" stroke="#d1a04a" stroke-width="3" stroke-linecap="round"/>
  <path d="m838 414 11 11 11-11" fill="none" stroke="#d1a04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="448" text-anchor="middle" fill="#d1a04a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Click once to preview — print only after choosing Copies and Print.</text>
</svg>
